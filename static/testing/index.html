<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Razorpay Test</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>

<h2>Airline Booking Payment Test</h2>

<button id="payBtn">Pay ₹250</button>

<pre id="output"></pre>

<script>
    document.getElementById("payBtn").addEventListener("click", () => {

        const options = {
            key: "rzp_test_TA0fzWv70Ss8pV",

            amount: 25000,

            currency: "INR",

            // IMPORTANT: Use the latest Order ID returned by your backend
            order_id: "order_TAhxHw3LFr20Hh",

            name: "Airline Booking",

            description: "Flight Ticket Payment",

            handler: function (response) {

                console.log(response);

                document.getElementById("output").textContent =
                    JSON.stringify(response, null, 2);

                alert("Payment Successful!");
            },

            modal: {
                ondismiss: function () {
                    console.log("Checkout closed.");
                }
            },

            theme: {
                color: "#2563eb"
            }
        };

        const rzp = new Razorpay(options);

        rzp.on("payment.failed", function (response) {
            console.log(response.error);

            document.getElementById("output").textContent =
                JSON.stringify(response.error, null, 2);

            alert("Payment Failed");
        });

        rzp.open();
    });
</script>

</body>
</html>
